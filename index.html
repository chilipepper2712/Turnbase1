<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Chiến Địa Doodle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>
  <div id="hud" hidden>
    <div id="topbar">
      <div id="turninfo"></div>
      <div id="missioninfo"></div>
      <div id="captureinfo"></div>
      <div class="spacer"></div>
      <button id="btn-sound" class="icon" aria-label="sound"></button>
      <button id="btn-fit" class="icon" aria-label="fit"></button>
      <button id="btn-menu" class="icon" aria-label="menu"></button>
    </div>
    <aside id="panel"></aside>
    <div id="preview" hidden></div>
    <div id="actions"></div>
    <button id="movebtn" class="primary" hidden></button>
    <button id="endturn" class="primary lg"></button>
    <div id="banner" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <div id="splash" hidden>
    <div class="card">
      <h1 id="splash-title"></h1>
      <p id="splash-sub"></p>
      <button id="splash-start" class="primary lg"></button>
      <small id="splash-note"></small>
    </div>
  </div>
  <div id="modal" hidden></div>
  <div id="loading">…</div>
  <script>
    // Chẩn đoán: hiện lỗi / thông tin trình duyệt ngay trên màn hình nếu game không tải được
    (function () {
      var l = document.getElementById('loading');
      function show(msg) { l.classList.remove('done'); l.style.cssText += ';font-size:15px;padding:20px;text-align:left;white-space:pre-wrap;overflow:auto;align-items:flex-start'; l.textContent = msg; }
      window.addEventListener('error', function (e) {
        show('Lỗi: ' + (e.message || (e.target && (e.target.src || e.target.href)) || '?') + '\nUA: ' + navigator.userAgent);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show('Lỗi (promise): ' + (e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (l.classList.contains('done')) return;
        var gl = null; try { gl = document.createElement('canvas').getContext('webgl2'); } catch (x) {}
        show('Chưa tải xong sau 10s.\nWebGL2: ' + (gl ? 'có' : 'KHÔNG') + '\nUA: ' + navigator.userAgent);
      }, 10000);
    })();
  </script>
  <script src="vendor/pixi.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
